# Server Configuration
server.port=8081
server.servlet.context-path=/user-service

# Application
spring.application.name=user-service

# H2 Database (in-memory)
spring.datasource.url=jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (for development)
jwt.secret=development-secret-key-change-in-production
jwt.expiration.ms=86400000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ✅ TEMPORARILY DISABLE SECURITY FOR TESTING
spring.security.enabled=false
