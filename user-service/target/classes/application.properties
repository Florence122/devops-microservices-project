# Server Configuration
server.port=8081
server.servlet.context-path=/user-service

# Application Name
spring.application.name=user-service

# Database Configuration (YOUR database)
spring.datasource.url=jdbc:postgresql://localhost:5433/userdb
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (YOUR security)
jwt.secret=your-256-bit-secret-for-jwt-tokens-change-in-production
jwt.expiration.ms=86400000  # 24 hours

# Actuator for Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Logging
logging.level.com.devops.userservice=DEBUG
logging.level.org.springframework.security=INFO

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method